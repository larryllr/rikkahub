// Export AGP's exact JVM test classpath when the Gradle worker fails on Windows.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    def unit = app.tasks.named('testGithubDebugUnitTest', org.gradle.api.tasks.testing.Test)
    app.tasks.register('writeKuanJvmClasspath') {
        dependsOn('compileGithubDebugUnitTestKotlin', 'processGithubDebugUnitTestJavaRes',
            'bundleGithubDebugClassesToRuntimeJar', 'processGithubDebugJavaRes')
        doLast {
            def test = unit.get()
            def output = app.layout.buildDirectory.file('kuan-jvm-classpath.txt').get().asFile
            output.write((test.testClassesDirs.files + test.classpath.files).collect { it.absolutePath }.join('\n'), 'UTF-8')
        }
    }
}
